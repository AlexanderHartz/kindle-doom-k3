defaults.pcm.card 0
defaults.pcm.device 0
defaults.pcm.subdevice -1
defaults.ctl.card 0

pcm.hw {
    @args [ CARD DEV SUBDEV ]
    @args.CARD {
        type integer
        default 0
    }
    @args.DEV {
        type integer
        default 0
    }
    @args.SUBDEV {
        type integer
        default -1
    }
    type hw
    card $CARD
    device $DEV
    subdevice $SUBDEV
}

pcm.plughw {
    @args [ CARD DEV SUBDEV ]
    @args.CARD {
        type integer
        default 0
    }
    @args.DEV {
        type integer
        default 0
    }
    @args.SUBDEV {
        type integer
        default -1
    }
    type plug
    slave.pcm {
        type hw
        card $CARD
        device $DEV
        subdevice $SUBDEV
    }
}

pcm.!default {
    type plug
    slave.pcm "hw"
}

ctl.hw {
    @args [ CARD ]
    @args.CARD {
        type integer
        default 0
    }
    type hw
    card $CARD
}

ctl.!default {
    type hw
    card 0
}
